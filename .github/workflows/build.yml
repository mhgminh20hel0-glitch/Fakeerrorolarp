name: Unzip and Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Find and Extract Zip
      run: |
        echo "Searching for zip files..."
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Found zip file: $ZIP_FILE. Extracting..."
          unzip -q "$ZIP_FILE" -d extracted_code
          # Di chuyển nội dung ra thư mục gốc nếu nằm trong thư mục con
          shopt -s dotglob
          mv extracted_code/* ./
          rm -rf extracted_code "$ZIP_FILE"
        else
          echo "No zip file found, using direct repository files."
        fi

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
        else
          echo "gradlew not found!"
          exit 1
        fi

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
